<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Simulation Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.5.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0/dist/chartjs-adapter-luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; flex: 1; margin: 0 10px; text-align: center; }
        .chart-container { position: relative; height: 600px; width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>XAUUSD Trading Bot Simulation (1m Interval)</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>Initial Balance</h3>
                <p id="initial-balance">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Final Balance</h3>
                <p id="final-balance">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Total Profit</h3>
                <p id="total-profit">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Win Rate</h3>
                <p id="win-rate">Loading...</p>
            </div>
        </div>

        <p style="text-align: right; color: #888; font-size: 0.9em;">Last Updated: <span id="last-updated">Never</span></p>

        <div class="chart-container">
            <canvas id="equityChart"></canvas>
        </div>

        <h2>Trade History</h2>
        <table id="trades-table">
            <thead>
                <tr>
                    <th>Entry Date</th>
                    <th>Type</th>
                    <th>Entry Price</th>
                    <th>Exit Price</th>
                    <th>Profit</th>
                    <th>Exit Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- Trades will be populated here -->
            </tbody>
        </table>
    </div>

    <script>
        let chartInstance = null;

        async function runSimulation() {
            try {
                const now = new Date();
                document.getElementById('last-updated').innerText = now.toLocaleTimeString();

                const response = await fetch('/simulate');
                const data = await response.json();

                // Update Stats
                document.getElementById('initial-balance').innerText = '$' + data.initial_balance;
                document.getElementById('final-balance').innerText = '$' + data.final_balance;
                document.getElementById('total-profit').innerText = '$' + data.total_profit;
                document.getElementById('win-rate').innerText = data.win_rate + '%';

                // Prepare Data for Chart
                const balanceData = data.equity_curve.map(item => ({
                    x: new Date(item.date).valueOf(),
                    y: item.balance
                }));

                const candleData = data.equity_curve.map(item => ({
                    x: new Date(item.date).valueOf(),
                    o: item.open,
                    h: item.high,
                    l: item.low,
                    c: item.close
                }));

                const ctx = document.getElementById('equityChart').getContext('2d');

                if (chartInstance) {
                    chartInstance.data.datasets[0].data = balanceData;
                    chartInstance.data.datasets[1].data = candleData;
                    chartInstance.update();
                } else {
                    chartInstance = new Chart(ctx, {
                        type: 'candlestick',
                        data: {
                            datasets: [
                                {
                                    label: 'Account Balance',
                                    type: 'line',
                                    data: balanceData,
                                    borderColor: 'green',
                                    yAxisID: 'y',
                                    fill: false,
                                    tension: 0.1,
                                    pointRadius: 0
                                },
                                {
                                    label: 'Gold Price (1m)',
                                    type: 'candlestick',
                                    data: candleData,
                                    yAxisID: 'y1',
                                    color: {
                                        up: '#00ff00',
                                        down: '#ff0000',
                                        unchanged: '#999',
                                    }
                                }
                            ]
                        },
                        options: {
                            animation: false,
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            scales: {
                                x: {
                                    type: 'time',
                                    time: {
                                        unit: 'minute'
                                    },
                                    grid: {
                                        display: false
                                    }
                                },
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    title: { display: true, text: 'Balance ($)' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    title: { display: true, text: 'Price' },
                                    grid: {
                                        drawOnChartArea: false
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            if (context.dataset.type === 'candlestick') {
                                                const p = context.raw;
                                                return `O: ${p.o} H: ${p.h} L: ${p.l} C: ${p.c}`;
                                            }
                                            return `${context.dataset.label}: ${context.raw.y}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                // Update Table
                const tableBody = document.querySelector('#trades-table tbody');
                tableBody.innerHTML = '';
                // Reverse trades to show newest first
                const reversedTrades = [...data.trades].reverse();
                reversedTrades.forEach(trade => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(trade.entry_date).toLocaleString()}</td>
                        <td>${trade.type}</td>
                        <td>${trade.entry_price}</td>
                        <td>${trade.exit_price}</td>
                        <td style="color: ${trade.profit >= 0 ? 'green' : 'red'}">${trade.profit}</td>
                        <td>${new Date(trade.exit_date).toLocaleString()}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Error fetching simulation data:', error);
                // alert('Failed to load simulation. Check console for details.');
            }
        }

        runSimulation();
        setInterval(runSimulation, 5000); // Poll every 5 seconds
    </script>
</body>
</html>
